name: Build Python Wheels - Multi Architecture

# This workflow builds Python wheel packages for different architectures
# Currently supports armv7 (32-bit ARM) with plans for additional architectures
# Can be triggered manually via workflow_dispatch

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture for the build'
        required: true
        default: 'armv7'
        type: choice
        options:
          - armv7
          - aarch64
          - x86_64
      build_config:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      python_version:
        description: 'Python version to use'
        required: true
        default: '3.10'
        type: choice
        options:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-wheel:
    name: Build Python Wheel for ${{ inputs.architecture }}
    runs-on: ["self-hosted", "1ES.Pool=onnxruntime-github-Ubuntu2204-AMD-CPU"]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python ${{ inputs.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          git \
          wget \
          python3-dev \
          python3-pip \
          python3-setuptools \
          python3-wheel \
          libssl-dev \
          libffi-dev

    - name: Install ARM cross-compilation tools (for armv7)
      if: inputs.architecture == 'armv7'
      run: |
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          qemu-user-static

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install wheel setuptools
        python -m pip install -r requirements.txt

    - name: Configure build directory
      run: |
        BUILD_DIR="build_${{ inputs.architecture }}"
        echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
        mkdir -p $BUILD_DIR

    - name: Build ONNX Runtime for armv7
      if: inputs.architecture == 'armv7'
      run: |
        python tools/ci_build/build.py \
          --build_dir $BUILD_DIR \
          --config ${{ inputs.build_config }} \
          --build_shared_lib \
          --cmake_extra_defines CMAKE_TOOLCHAIN_FILE=cmake/linux_arm32_crosscompile_toolchain.cmake \
          --parallel \
          --skip_tests

    - name: Build ONNX Runtime for aarch64
      if: inputs.architecture == 'aarch64'
      run: |
        python tools/ci_build/build.py \
          --build_dir $BUILD_DIR \
          --config ${{ inputs.build_config }} \
          --build_shared_lib \
          --parallel \
          --skip_tests

    - name: Build ONNX Runtime for x86_64
      if: inputs.architecture == 'x86_64'
      run: |
        python tools/ci_build/build.py \
          --build_dir $BUILD_DIR \
          --config ${{ inputs.build_config }} \
          --build_shared_lib \
          --parallel \
          --skip_tests

    - name: Build Python Wheel for armv7
      if: inputs.architecture == 'armv7'
      run: |
        export AUDITWHEEL_PLAT=manylinux2014_armv7l
        python tools/ci_build/build.py \
          --build_dir $BUILD_DIR \
          --config ${{ inputs.build_config }} \
          --build_wheel \
          --cmake_extra_defines CMAKE_TOOLCHAIN_FILE=cmake/linux_arm32_crosscompile_toolchain.cmake \
          --parallel \
          --skip_tests

    - name: Build Python Wheel for aarch64
      if: inputs.architecture == 'aarch64'
      run: |
        export AUDITWHEEL_PLAT=manylinux2014_aarch64
        python tools/ci_build/build.py \
          --build_dir $BUILD_DIR \
          --config ${{ inputs.build_config }} \
          --build_wheel \
          --parallel \
          --skip_tests

    - name: Build Python Wheel for x86_64
      if: inputs.architecture == 'x86_64'
      run: |
        export AUDITWHEEL_PLAT=manylinux2014_x86_64
        python tools/ci_build/build.py \
          --build_dir $BUILD_DIR \
          --config ${{ inputs.build_config }} \
          --build_wheel \
          --parallel \
          --skip_tests

    - name: List built wheels
      run: |
        echo "Looking for wheel files in build directory..."
        find $BUILD_DIR -name "*.whl" -type f
        if [ -d "$BUILD_DIR/${{ inputs.build_config }}/dist/" ]; then
          echo "Contents of dist directory:"
          ls -la $BUILD_DIR/${{ inputs.build_config }}/dist/
        else
          echo "No dist directory found"
        fi

    - name: Upload wheel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: onnxruntime-wheel-${{ inputs.architecture }}-${{ inputs.build_config }}-py${{ inputs.python_version }}
        path: |
          ${{ env.BUILD_DIR }}/**/*.whl
        retention-days: 30
        if-no-files-found: warn

    - name: Display build summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture**: ${{ inputs.architecture }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Configuration**: ${{ inputs.build_config }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Python Version**: ${{ inputs.python_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Directory**: ${{ env.BUILD_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Built Wheels:" >> $GITHUB_STEP_SUMMARY
        find $BUILD_DIR -name "*.whl" -type f | while read wheel; do
          echo "- $(basename $wheel)" >> $GITHUB_STEP_SUMMARY
        done || echo "- No wheels found" >> $GITHUB_STEP_SUMMARY